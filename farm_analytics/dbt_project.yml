name: 'farm_analytics'
version: '1.0.0'

profile: 'farm_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Layered architecture: raw (source) -> staging -> intermediate -> marts
#   staging       1:1 with source tables; rename, cast, light cleanup. Views.
#   intermediate  reusable joins and business logic. Ephemeral (inlined).
#   marts/core    dimensional model (dims + facts) for BI. Tables.
#   marts/kpi     dashboard-ready KPI tables (one per Tableau view). Tables.
models:
  farm_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      core:
        +schema: core
      kpi:
        +schema: kpi

